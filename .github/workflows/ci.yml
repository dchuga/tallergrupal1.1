name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

      - name: Ejecutar pruebas
        run: mvn -B test

      - name: Reportar estado
        if: always()
        run: echo "Estado de la construccion - ${{ job.status }}"
